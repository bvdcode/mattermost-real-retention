services:
  mattermost-real-retention:
    image: bvdcode/mattermost-real-retention:latest
    restart: unless-stopped
    volumes:
      - /storage/mattermost/data:/mattermost/data
    environment:
      - DATABASE_HOST=${MM_DATABASE_HOST:-postgres}
      - DATABASE_PORT=${MM_DATABASE_PORT:-5432}
      - DATABASE_USER=${MM_DATABASE_USER:-mattermost}
      - DATABASE_PASSWORD=${MM_DATABASE_PASSWORD}
      - DATABASE_NAME=${MM_DATABASE_NAME:-mattermost}
      - DRY_RUN=${DRY_RUN:-true}
      - WEBHOOK_URL=${MM_RETENTION_WEBHOOK_URL:-}
