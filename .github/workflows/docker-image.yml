name: Build and push

on:
  push:
    branches: [main]
    paths: 
      - 'Sources/**'
      - 'Tests/**'
      - 'NuGet.Config'
      - 'GitVersion.yml'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'NuGet.Config'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  CONTEXT_DIR: Sources
  DOCKERFILE: Dockerfile
  DOCKER_NAMESPACE: bvdcode
  DOCKER_IMAGE_NAME: mattermost-real-retention

jobs:
  test:
    name: Build and test against PostgreSQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: retention-tests
          POSTGRES_DB: retention_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RETENTION_TEST_DATABASE: Host=localhost;Port=5432;Database=retention_tests;Username=postgres;Password=retention-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Sources/Mattermost.RealRetention.sln --configuration Release --nologo

  push_to_registry:
    name: push docker image to hub
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.x

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ steps.gitversion.outputs.MajorMinorPatch }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"

      - name: Compose tags
        id: tags
        shell: bash
        run: |
          VERSION="${{ steps.gitversion.outputs.MajorMinorPatch }}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version: $VERSION" >&2; exit 1; }
          echo "release_tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${{ env.DOCKER_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:$VERSION" >> "$GITHUB_OUTPUT"
          echo "docker_tag_latest=${{ env.DOCKER_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          echo "ghcr_tag=ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:$VERSION" >> "$GITHUB_OUTPUT"
          echo "ghcr_tag_latest=ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push to Docker Hub (X.Y.Z + latest)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_DIR }}
          file: ${{ env.CONTEXT_DIR }}/${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ steps.tags.outputs.docker_tag }}
            ${{ steps.tags.outputs.docker_tag_latest }}
            ${{ env.DOCKER_NAMESPACE }}/${{ env.DOCKER_IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push to GHCR (X.Y.Z + latest)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_DIR }}
          file: ${{ env.CONTEXT_DIR }}/${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ steps.tags.outputs.ghcr_tag }}
            ${{ steps.tags.outputs.ghcr_tag_latest }}
            ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Create GitHub Release (only if version advanced)
        if: ${{ steps.gitversion.outputs.CommitsSinceVersionSource > 0 }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tags.outputs.release_tag }}
          name: Release ${{ steps.tags.outputs.release_tag }}
          skipIfReleaseExists: true
          makeLatest: true
          draft: false
          prerelease: false
          token: ${{ github.token }}
